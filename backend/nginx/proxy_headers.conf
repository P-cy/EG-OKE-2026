# header ที่ทุก location ต้องส่งต่อให้ backend — ไม่มี timeout อยู่ในนี้
#
# ★ ที่แยกออกมาจาก proxy_common.conf เพราะ nginx ไม่ยอมให้ประกาศ directive
#   ซ้ำใน scope เดียวกัน location ที่ต้องตั้ง timeout เอง (SSE, ไฟล์ CSV)
#   จึง include ไฟล์นี้แทน แล้วตั้ง timeout ของตัวเอง
#   ถ้า include proxy_common.conf แล้วเขียน proxy_read_timeout ทับ
#   nginx จะไม่บูตเลย: "proxy_read_timeout directive is duplicate"

proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;
