# security header — ต้อง include ซ้ำในทุก location ที่มี add_header ของตัวเอง
#
# ★ nginx สืบทอด add_header จาก scope บนให้ก็ต่อเมื่อ scope ล่าง "ไม่มี add_header
#   ของตัวเองเลยสักตัว" มีเมื่อไหร่คือทิ้งของแม่ทั้งหมด ไม่ใช่รวมกัน
#   และมันไม่เตือนอะไรเลย — nginx -t ผ่าน เว็บใช้ได้ปกติ แต่ HSTS หายเงียบๆ
#
#   เจอตอนเทียบ header จริง:
#     /healthz            -> ส่ง security header ครบ 4 ตัว
#     /v1/live/snapshot   -> ส่ง 0 ตัว   (เพราะมี add_header X-Cache-Status)
#
#   location ที่ต้อง include ไฟล์นี้ซ้ำ = ทุกอันที่เขียน add_header เอง

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# DENY = ห้ามเว็บอื่นเอาหน้าเราไปฝัง iframe (กัน clickjacking)
# ★ ถ้าวันหนึ่งจะเอาหน้า /display ไปฝัง iframe บนจอหน้างาน ต้องผ่อนบรรทัดนี้
#   เป็น SAMEORIGIN ก่อน ไม่งั้นจอจะขึ้นขาวโดยไม่มี error ให้เห็นบนหน้าจอ
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
