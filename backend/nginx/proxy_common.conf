# header + timeout มาตรฐาน — ใช้กับ location ทั่วไป
# location ที่ต้องการ timeout ต่างจากนี้ (SSE, ไฟล์ CSV, WebSocket)
# ให้ include proxy_headers.conf แทน แล้วตั้ง timeout เอง

include /etc/nginx/proxy_headers.conf;

proxy_connect_timeout 3s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# ลองเครื่องถัดไปถ้าตัวแรกไม่ตอบ (ใช้ตอน scale เป็นหลาย upstream)
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
